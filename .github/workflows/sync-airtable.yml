name: Sync Airtable data

on:
  schedule:
    - cron: "0 11 * * *" # daily, 06:00 Central
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull Airtable data and rebuild radar-data.js
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python dev/data/sync_airtable.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/data
          if git diff --cached --quiet; then
            echo "No Airtable changes."
          else
            git commit -m "Sync Airtable data"
            git push
          fi
